# Development: on a developer's phone or emulator, beside the released app, which keeps its
# own identity and data.

[app]
name = "AI App (development)"
android_package = "io.github.trungnguyen278.aiapp.dev"
ios_bundle_identifier = "io.github.trungnguyen278.aiapp.dev"

[studio]
enabled = true

[cloud]
# A developer's own cloud, on their machine, may be reached without TLS (SEC-1).
plain_http = true
