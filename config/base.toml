# The app's configuration, shared by every environment (docs/architecture.md, Configuration).
#
# An environment's file (environments/<name>.toml) changes what it needs on top, then a
# git-ignored local.toml, for one machine. Every value is required, and is checked against
# schema.json when the app starts or is built. The app holds no secret.

[app]
# The name people see on their phone: the one place it is written (CONTRIBUTING.md, rule 4).
name = "AI App"
# Expo's name for the project, in its tools and links.
slug = "ai-app"
# The scheme of the app's own links, such as aiapp://homes.
scheme = "aiapp"
# The app's identity in the stores. It can still change until the first release in a store,
# and never after it.
android_package = "io.github.trungnguyen278.aiapp"
ios_bundle_identifier = "io.github.trungnguyen278.aiapp"

[studio]
# The studio shows every token, component and motion of the design system, in both themes
# (ADR-0003). Only the development app has it, in a debug build or in a release build, where
# motion is judged.
enabled = false

[sign_in]
# The ways people sign in, in the order the sign-in screen offers them. "development" is the
# development cloud's provider, which signs in a test person by name and email (the app API,
# Development); the simulated cloud has it too. Google's and Apple's come with the project's
# client IDs (ADR-0004, decision 4).
providers = ["development"]

[session]
# Seconds before its access token expires when the session refreshes it, so that no request
# leaves with a token about to expire.
refresh_margin = 60

[queries]
# How many times a read is tried again when no answer came, or the cloud could not serve it,
# each wait twice the last (TanStack Query's own backoff).
retries = 3
# Seconds that what a read brought stays fresh, before a screen showing it asks the cloud again.
stale_time = 30

[setup]
# Seconds the app waits for each of a device's answers in set-up, before it ends the session.
# Longer than the longest answer a device takes: a robot answers `join` within its join_timeout,
# 60 seconds (ai-robot, config/base.toml, [modules.setup]).
answer_timeout = 90

[cloud]
# The cloud that the app talks to (ADR-0004, decision 6): "simulated", the app API run inside
# the app, in memory, which forgets everything when the app stops; or a cloud's address, such
# as https://cloud.example. A real cloud is named only on the machine that builds the app, in
# config/local.toml or in AI_APP_CLOUD_ADDRESS (.env.example), never in a committed file.
address = "simulated"
# Whether that address may be http://, without TLS: only to a developer's own machine (SEC-1).
plain_http = false
# The app's identifier at the cloud's OAuth endpoints, one that the cloud's configuration lists
# (the app API, The exchange).
client_id = "ai-app"
# Seconds a request may take, from sending it to reading its answer, before the cloud counts
# as unreachable.
timeout = 15
# How many times a request with an Idempotency-Key, which the protocol makes safe to repeat,
# is sent again when no answer came, or when the cloud answered that its first copy still runs
# (the app API, Requests).
retries = 3
# Seconds before the first of those retries; each one after waits twice as long.
retry_delay = 0.5
# How many items a page of a list asks for: from 1 to 50 (the app API, Sessions).
page_size = 20
# The most bytes an answer may have: a larger one is refused, unread if it says its length
# (SEC-15).
answer_limit = 1_048_576

[cloud.simulated]
# The simulated cloud: the settings of ai-cloud's configuration (the app API, Settings), with
# its values, and the simulation's pace.
#
# Seconds it takes to answer, so that screens wait as they do for a real cloud.
latency = 0.3
# Seconds a nonce stays valid.
nonce_lifetime = 300
# Seconds an access token is valid.
access_lifetime = 600
# Seconds a session lasts unused: 90 days.
refresh_idle = 7_776_000
# Seconds after its first use within which a refresh token refreshes again, while its
# replacement is unused: a retry after a lost answer (ai-platform ADR-0011).
refresh_reuse = 60
# Seconds since it was issued within which an ID token may delete its account or a home, or
# hand a home over.
recent_sign_in = 300
# Seconds a retry with an Idempotency-Key gets the first answer: 24 hours.
idempotency_retention = 86_400
# How many homes an account may be in: as in Google Home.
homes_per_account = 5
# How many people a home may have, profiles included.
members_per_home = 30
# Seconds an invitation's code is valid: 3 days.
invitation_lifetime = 259_200
# How many open invitations a home may have.
invitations_per_home = 10
# Seconds the simulated providers' ID tokens are valid, as the development cloud's are.
id_token_lifetime = 600
# The address that devices use to reach the cloud, which the app gives a device at set-up and
# its registration names. Simulated devices reach the simulated cloud in memory, so it is a
# name under .invalid, which never resolves (RFC 6761, 6.4).
server = "https://simulated.invalid"
# Seconds a challenge to register a device is valid: as AWS IoT's claim certificates.
challenge_lifetime = 300
# How many devices a home may have: as SmartThings.
devices_per_home = 300

[cloud.simulated.nonce_rate]
# How many nonces the phone gets: 10 a minute.
limit = 10
period = 60

[cloud.simulated.invitation_rate]
# How many invitation codes one account may try: 10 a minute.
limit = 10
period = 60

[cloud.simulated.challenge_rate]
# How many challenges to register a device one account gets: 10 a minute.
limit = 10
period = 60
